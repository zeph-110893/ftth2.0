version: '3.8'

services:
  ftth-billing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftth-billing
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ftth-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/ftth_database.sqlite

volumes:
  ftth-data:
